<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cảm ơn</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#fff5f5;
    text-align:center;
    padding:50px;
}

.box{
    background:white;
    max-width:600px;
    margin:auto;
    padding:35px;
    border-radius:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

h1{
    color:#24bd2e;
}

p{
    line-height:1.6;
    color:#444;
}

.fb-btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 24px;
    background:#1877f2;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
    font-size:16px;
}

.fb-btn:hover{
    opacity:.9;
}

.note{
    margin-top:20px;
    color:#666;
    font-size:14px;
}
</style>

</head>
<body>

<div class="box">

    <h1>🎉 Cảm ơn bạn!</h1>

    <p>
        Phản hồi của bạn đã được ghi nhận.
    </p>

    <p>
        Hãy theo dõi bình luận <b>01 thực trạng hoặc nguyên nhân</b>
        liên quan đến <b>cháy nổ</b> hoặc <b>trộm cắp</b>
        mà bạn biết dưới bài viết Facebook sau.
    </p>

    <a
        class="fb-btn"
        href="https://www.facebook.com/FireEyevn"
        target="_blank"
    >
        MỞ BÀI VIẾT FACEBOOK
    </a>

    <div class="note">
        Sau khi bình luận xong, vui lòng đưa màn hình cho ban tổ chức để xác nhận hoàn thành.
    </div>

</div>

</body>
</html>
