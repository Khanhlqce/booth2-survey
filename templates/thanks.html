<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cảm ơn</title>
<style>
body{
    font-family:Arial;
    background:#fff5f5;
    text-align:center;
    padding:50px;
}
.box{
    background:white;
    max-width:500px;
    margin:auto;
    padding:35px;
    border-radius:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}
h1{color:#24bd2e;}
a{color:#24bd2e;font-weight:bold;}
</style>
</head>
<body>
<div class="box">
    <h1>Cảm ơn bạn!</h1>
    <p>Phản hồi của bạn đã được ghi nhận.</p>
    <p>Hãy tiếp tục trải nghiệm FireEye AI tại sự kiện.</p>
    <a href="/">Quay lại khảo sát</a>
</div>
</body>
</html>
